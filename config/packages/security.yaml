security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'plaintext' # disabled hashing passwords for now because i had errors in authentication

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User  # Make sure this is correct
                property: email  # Login will use email instead of username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_user_login  # The route for the login page
                check_path: app_user_login  # The route Symfony will check for login submissions
                success_handler: App\Security\LoginSuccessHandler
                username_parameter: _email   # Match the input field name from your form
                password_parameter: _password  # Match the input field name from your form

            logout:
                path: app_user_logout  # Logout route
                target: app_user_login  # Redirect after logout

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # Seuls les utilisateurs ayant ROLE_ADMIN peuvent accéder aux pages du backoffice
        - { path: ^/back_office, roles: ROLE_ADMIN }
        # Seuls les utilisateurs authentifiés (avec ROLE_USER par exemple) peuvent accéder aux pages frontoffice
        - { path: ^/front_office, roles: ROLE_USER }
        # Les pages de login restent accessibles à tous
        #- { path: ^/user/login, roles: IS_AUTHENTICATED_ANONYMOUSLY }


when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
